<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Temporal Maze Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { display: flex; justify-content: center; padding: 24px; font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { max-width: 900px; width: 100%; }
    video { width: 100%; height: auto; border-radius: 12px; }
    p { opacity: 0.8; }
  </style>
</head>
<body>
  <main class="wrap">
    <video autoplay muted loop controls playsinline poster="assets/temporal-maze-demo.png">
      <source src="assets/temporal-maze-demo.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <p>If autoplay is blocked by your browser, press play once. The demo will loop.</p>
  </main>
</body>
</html>
